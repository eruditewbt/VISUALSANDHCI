name: Publish learning app to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "docs/**"
      - ".github/workflows/app-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_CONNECTWBT_API_BASE: ${{ vars.VITE_CONNECTWBT_API_BASE }}
      VITE_CONNECTWBT_PROJECT_ID: ${{ vars.VITE_CONNECTWBT_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate public deployment configuration
        run: |
          for name in VITE_CONNECTWBT_API_BASE VITE_CONNECTWBT_PROJECT_ID VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions repository variable: ${name}"
              exit 1
            fi
          done
      - name: Test app
        run: npm test -- --run --pool=threads --maxWorkers=1
      - name: Build app
        run: npm run build
      - name: Assemble static site without replacing existing docs pages
        run: |
          mkdir -p ../site/app
          cp -R ../docs/. ../site/
          cp -R dist/. ../site/app/
          touch ../site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload app artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
